services:
  app:
    build:
      context: ../
      dockerfile: infra/docker/php-fpm/Dockerfile.prod
    image: nffacil-app:latest
    restart: always
    environment:
      APP_ENV: local
      APP_DEBUG: true
      # APP_KEY provided by .env file mount
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      CACHE_DRIVER: file
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: file
      REDIS_HOST: redis
    volumes:
      # Hot Reload Mounts:
      - ../app:/var/www/html/app
      - ../resources:/var/www/html/resources
      - ../routes:/var/www/html/routes
      - ../config:/var/www/html/config
      - ../database:/var/www/html/database
      # Persistence & Config:
      - nffacil_storage:/var/www/html/storage
      - ../.env:/var/www/html/.env
      - nffacil_public_build:/var/www/html/public/build
    depends_on:
      - db
      - redis

  web:
    build:
      context: ../
      dockerfile: infra/docker/nginx/Dockerfile.prod
    image: nffacil-nginx:latest
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - nffacil_public_build:/var/www/html/public/build
    depends_on:
      - app

  db:
    image: mariadb:10.11
    restart: always
    environment:
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - nffacil_db_data:/var/lib/mysql

  redis:
    image: redis:alpine
    restart: always

volumes:
  nffacil_db_data:
  nffacil_storage:
  nffacil_public_build:
